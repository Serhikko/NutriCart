# JVM memory for the Gradle build process
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use AndroidX libraries (the modern replacement of the old support library)
android.useAndroidX=true
# Official Kotlin code style
kotlin.code.style=official
# Each module generates only its own R class — faster builds
android.nonTransitiveRClass=true
# AGP 9 "built-in Kotlin": the Android plugin itself provides Kotlin support,
# so build files do NOT apply org.jetbrains.kotlin.android anymore.
# The Kotlin version is pinned in the root build.gradle.kts (buildscript classpath).
