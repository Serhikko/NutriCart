<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>NutriCart</title>
  <!-- The Ember ring: one open progress ring (12 o'clock round to 10 o'clock), the same construction as the
       app's Ring component: two half arcs, each with a vertical gradient that is flat across the 6 o'clock band
       (so the halves meet without a seam), round ends drawn as circles filled with the same gradients.
       Warm graphite ground, a soft static glow, one specular highlight. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26201D"/>
      <stop offset=".55" stop-color="#131214"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcR" x1="0" y1="282.0" x2="0" y2="742.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <linearGradient id="arcL" x1="0" y1="742.0" x2="0" y2="366.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FF375F"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="0" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="292" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="124"/>
  <g filter="url(#soft)" opacity=".55">
    <path d="M512.0 220.0 A292 292 0 0 1 512.0 804.0" fill="none" stroke="url(#arcR)" stroke-width="124"/>
    <path d="M512.0 804.0 A292 292 0 0 1 259.1 366.0" fill="none" stroke="url(#arcL)" stroke-width="124"/>
    <circle cx="512.0" cy="220.0" r="62.0" fill="url(#arcR)"/>
    <circle cx="259.1" cy="366.0" r="62.0" fill="url(#arcL)"/>
  </g>
  <path d="M512.0 220.0 A292 292 0 0 1 512.0 804.0" fill="none" stroke="url(#arcR)" stroke-width="124"/>
    <path d="M512.0 804.0 A292 292 0 0 1 259.1 366.0" fill="none" stroke="url(#arcL)" stroke-width="124"/>
    <circle cx="512.0" cy="220.0" r="62.0" fill="url(#arcR)"/>
    <circle cx="259.1" cy="366.0" r="62.0" fill="url(#arcL)"/>
  <path d="M520.0 172.0 A340.0 340.0 0 0 1 817.6 363.0" fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="10" stroke-linecap="round"/>
</svg>
