# Applies to the screenshot tests in this package only (pure JVM tests elsewhere are unaffected).
# SDK 37 = the app's compileSdk/targetSdk (supported since Robolectric 4.17).
sdk=37
# A plain Application instead of the @HiltAndroidApp one: screenshot tests render
# stateless Content composables and need no DI graph, WorkManager or database.
application=android.app.Application
# Phone close to a Pixel 9-class device: 393 x 852 dp at 440 dpi (density 2.75).
qualifiers=w393dp-h852dp-normal-long-notround-port-440dpi-keyshidden-nonav
